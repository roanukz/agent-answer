<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share card for the TOOL page. og-image.svg is the teardown's card; this one
  drops the "product teardown" kicker and leads with the promise instead,
  because somebody clicking a link to the tool wants to know what it does,
  not that an essay exists about it. public/og-tool.png is rendered from this
  file at 2x, 2400x1254. The render command is in the README.

  LAYOUT IS CENTRED ON PURPOSE. LinkedIn's profile "Featured" section does not
  honour the 1.91:1 ratio: it centre-crops into a roughly square frame, which
  throws away half the width. Every element lives inside a 540px-wide centre
  column (x 330..870) so it survives that crop and still reads as a deliberate
  centred card at full width.

  Colours are literal values from tokens.css dark mapping, because an SVG
  cannot read a stylesheet and this file must not fetch anything. Fonts are a
  plain system stack. No webfont, no network request, ever.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">

  <rect width="1200" height="627" fill="#10141a"/>

  <!-- ============ an article, three sections, one an agent cannot answer from ============ -->

  <rect x="450" y="74" width="300" height="222" rx="14" fill="#1b2028" stroke="#3f4653" stroke-width="2"/>

  <!-- section 1 passes -->
  <rect x="468" y="98" width="4" height="42" rx="2" fill="#4aa576"/>
  <rect x="486" y="98" width="126" height="13" rx="6.5" fill="#6f7887"/>
  <rect x="486" y="121" width="180" height="8" rx="4" fill="#2b313b"/>
  <path d="M 692 116 L 700 124 L 716 106" fill="none" stroke="#4aa576" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- section 2 fails: retrieved alone it opens mid-thought -->
  <rect x="468" y="162" width="4" height="42" rx="2" fill="#d96450"/>
  <rect x="486" y="162" width="96" height="13" rx="6.5" fill="#6f7887"/>
  <rect x="486" y="185" width="180" height="8" rx="4" fill="#3f2a26"/>
  <path d="M 694 170 L 714 190 M 714 170 L 694 190" fill="none" stroke="#d96450" stroke-width="5"
        stroke-linecap="round"/>

  <!-- section 3 passes -->
  <rect x="468" y="226" width="4" height="42" rx="2" fill="#4aa576"/>
  <rect x="486" y="226" width="150" height="13" rx="6.5" fill="#6f7887"/>
  <rect x="486" y="249" width="180" height="8" rx="4" fill="#2b313b"/>
  <path d="M 692 244 L 700 252 L 716 234" fill="none" stroke="#4aa576" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ name and promise ============ -->

  <text x="600" y="392" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" fill="#f7f8f9">Will My Agent</text>
  <text x="600" y="454" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" fill="#f7f8f9">Answer This?</text>

  <rect x="545" y="480" width="110" height="5" rx="2.5" fill="#4c9bb0"/>

  <text x="600" y="531" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">Paste a KB article. See whether</text>
  <text x="600" y="566" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">an AI agent can answer from it.</text>

</svg>
